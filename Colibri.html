<style>

.opt.ok{border-color:var(--in);font-weight:700}.fb{margin:4px 0 12px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:.92rem;line-height:1.45}.fb p{margin:6px 0 0}.fb.ok{border-color:var(--in)}.fb.bad{border-color:var(--out)}.gm{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}.gm:last-child{border:0}.gm b{display:block}.gm span{font-size:.85rem;color:var(--muted)}.gm .btn{width:auto;flex:none;padding:9px 22px}.tag{background:var(--coin);color:var(--coinink);border-radius:99px;padding:2px 10px;font-size:.75rem;font-weight:700;margin-left:8px}

.pk{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 14px}.pk button{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.5rem;cursor:pointer;padding:0}.pk button.on{border-color:var(--xp);box-shadow:0 0 0 2px var(--xp)}.pk.c button{border:3px solid var(--surface)}

.fb{color:var(--out);font-size:.9rem;min-height:1.2em}.fb.ok,.fb.ok b,.fb.ok p{color:var(--in)}.fb.bad,.fb.bad b,.fb.bad p{color:var(--out)}.why{color:var(--in);font-weight:600}

.small{font-size:.85rem;color:var(--muted)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}

.cv-lnk:focus-visible{outline:3px solid #fff;outline-offset:3px}

main.chatm{padding-bottom:20px}

.cb{max-width:88%;padding:10px 14px;border-radius:18px;line-height:1.45;overflow-wrap:anywhere}

.typing{color:var(--muted)}

.lnk{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:.8rem}

nav button{font-size:.74rem}
.dh{border-radius:20px;padding:18px 20px;background:var(--xp);color:var(--surface);margin:12px 0 10px}

.dh .num{display:block;font-size:2.4rem;line-height:1.15;margin:2px 0 4px}.dh p{margin:0;font-size:.95rem}
.sum2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.sum2 b{font:700 1.2rem "Bricolage Grotesque",sans-serif}
.mc{margin-top:10px}.mc .big{font:700 1.3rem "Bricolage Grotesque",sans-serif;display:block}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}

.mrow{display:flex;gap:8px;margin-top:8px}.mrow input{margin:0;flex:1}.mrow .btn{width:auto;padding:0 18px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.top .brand{margin:0}

.xpb{animation:xpb .7s ease}@keyframes xpb{40%{transform:scale(1.12)}}

.cfh{font:700 .95rem Figtree,sans-serif;color:var(--muted);margin:18px 0 8px}
.seg3{display:flex;gap:6px}.seg3 button{flex:1;font:600 .9rem Figtree,sans-serif;padding:9px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}

a.btn{display:block;text-align:center;text-decoration:none}
.fbs{font-size:1.3rem!important}

<script>
const $=s=>document.querySelector(s);
const KEY='trocado-v1';
let S={xp:0,streak:0,last:'',done:[],tx:[],badges:[],nivel:'',best:{},nome:'',av:null};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{S.upd=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}sync()};
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const LESSONS=[
{id:'l1',t:'Pague-se primeiro',b:'Divida o que entra: 50% para o essencial, 30% para o que você quer e 20% para o seu futuro. Não precisa ser exato. Serve de bússola.',q:'Entraram R$ 2.000. Quanto vai para o futuro na regra 50/30/20?',o:['R$ 200','R$ 400','R$ 600'],a:1,w:'20% de R$ 2.000 são R$ 400.'},
{id:'l2',t:'Reserva de emergência',b:'É um dinheiro guardado para imprevistos. A meta inicial é cobrir de 3 a 6 meses do seu custo de vida, em algo que você saque rápido.',q:'Para que serve a reserva de emergência?',o:['Comprar uma viagem','Cobrir imprevistos sem se endividar','Ganhar o máximo de rendimento'],a:1,w:'Ela existe para você não pegar dívida quando o imprevisto chegar.'},
{id:'l3',t:'Juros compostos',b:'São os juros sobre os juros: o rendimento de hoje também rende amanhã. Por isso, o tempo pesa mais do que o valor.',q:'O que mais ajuda no longo prazo?',o:['Começar cedo, mesmo com pouco','Esperar ter muito dinheiro','Trocar de investimento todo mês'],a:0,w:'Quanto mais tempo o dinheiro rende, mais os juros trabalham por você.'},
{id:'l4',t:'Cartão sem susto',b:'O rotativo do cartão está entre os juros mais altos que existem. Pagar só o mínimo faz a dívida crescer mês a mês.',q:'A fatura veio R$ 1.000. Qual é a melhor atitude?',o:['Pagar o mínimo','Pagar o valor total','Deixar para o próximo mês'],a:1,w:'Pagar o total evita os juros do rotativo.'},
{id:'l5',t:'O gasto invisível',b:'Assinaturas e pequenos gastos diários somam muito no fim do mês. Anotar tudo por uma semana já mostra para onde o dinheiro vai.',q:'R$ 15 por dia em lanches somam quanto em 30 dias?',o:['R$ 150','R$ 450','R$ 900'],a:1,w:'15 × 30 = R$ 450.'}];
const BADGES=[
{n:'Primeiro passo',d:'Conclua 1 lição',i:'🌱',ok:()=>S.done.length>=1},
{n:'Estudioso',d:'Conclua as 5 lições',i:'🎓',ok:()=>S.done.length>=LESSONS.length},
{n:'Contador',d:'Faça seu 1º lançamento',i:'🧾',ok:()=>S.tx.some(t=>!t.seed)},
{n:'Poupador',d:'Guarde 20% da renda do mês',i:'🐷',ok:()=>{const m=month(true);return m.i>0&&(m.i-m.o)/m.i>=.2}},
{n:'Em chamas',d:'3 dias seguidos',i:'🔥',ok:()=>S.streak>=3},
{n:'Gamer',d:'Termine 1 jogo',i:'🎮',ok:()=>Object.keys(S.best).length>=1}];
const CIN=['Salário','Negócio','Extra'],COUT=['Moradia','Comida','Transporte','Lazer','Fornecedores','Saúde','Crédito','Outros'];
const COL=['#4B0082','#FFE26E','#8A4FD0','#E8C547','#2E0054','#FFF1A8','#B79AD9','#C79A00'];
let tab='learn',openId=null,ftype='out';
const lvl=()=>Math.floor(S.xp/50)+1;
const mkey=(o=0)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-o);return ymd(d).slice(0,7)};
function month(real,k=mkey()){let i=0,o=0;S.tx.forEach(t=>{if(t.date.slice(0,7)!==k||(real&&t.seed))return;t.t==='in'?i+=t.v:o+=t.v});return{i,o}}
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2600)}
function bump(){const n=new Date(),today=ymd(n);if(S.last===today)return;const y=new Date(n);y.setDate(y.getDate()-1);S.streak=S.last===ymd(y)?S.streak+1:1;S.last=today}
function gain(n,msg){const lv=lvl();S.xp+=n;const fresh=BADGES.filter(b=>b.ok()&&!S.badges.includes(b.n));fresh.forEach(b=>S.badges.push(b.n));save();
let m=msg;if(lvl()>lv)m+=' Nível '+lvl()+'!';if(fresh.length)m+=' Conquista: '+fresh.map(b=>b.n).join(', ');toast(m)}
function hero(){const p=S.xp%50,C=2*Math.PI*44;
return `<section class="hero"><button class="av" data-act="prof" aria-label="Editar perfil"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="44"/><circle class="ring" cx="50" cy="50" r="44" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/50)}" transform="rotate(-90 50 50)"/></svg>${avatar(S.av,70)}<b class="lvb">${lvl()}</b></button>
<div><h1>Oi, ${esc(S.nome||'você')}!</h1><small>Nível ${lvl()} · faltam ${50-p} XP para o ${lvl()+1}</small><span class="chip">🔥 ${S.streak} ${S.streak===1?'dia':'dias'} seguidos</span>${S.nivel?' <span class="chip">'+NV[S.nivel]+'</span>':''}</div></section>`}
function learn(){const n=S.done.length;
return `${foryou()}<h2>Sua dose de hoje</h2><p class="sub">Escolha uma lição. Cada uma leva cerca de 2 minutos.</p>
<p class="small">${n} de ${LESSONS.length} concluídas</p><div class="meter"><i style="width:${n/LESSONS.length*100}%"></i></div>
<div class="panel">${LESSONS.map((l,k)=>{const d=S.done.includes(l.id);
return `<details class="lesson ${d?'done':''}" data-id="${l.id}" ${openId===l.id?'open':''}><summary><span class="st">${d?'✓':k+1}</span><div><b>${l.t}</b><span>2 min · +20 XP</span></div></summary>
<div class="lbody"><p>${l.b}</p><p class="q">${l.q}</p>${d?`<p class="why">${l.w}</p>`:`<div class="lq">${l.o.map((o,i)=>`<button class="opt" data-l="${k}" data-i="${i}">${o}</button>`).join('')}<p class="fb"></p></div>`}</div></details>`}).join('')}</div>${progress()}`}
function bars(){const ks=[5,4,3,2,1,0].map(mkey),ms=ks.map(k=>month(false,k)),mx=Math.max(1,...ms.flatMap(m=>[m.i,m.o]));
return `<svg viewBox="0 0 320 150" width="100%" role="img" aria-label="Receitas e despesas por mês"><line class="base" x1="0" x2="320" y1="120" y2="120"/>${ms.map((m,k)=>{const x=12+k*52,hi=m.i/mx*100,ho=m.o/mx*100,nm=new Date(ks[k]+'-15').toLocaleDateString('pt-BR',{month:'short'}).replace('.','');
return `<rect class="bi" x="${x}" y="${120-hi}" width="18" height="${hi}" rx="4"/><rect class="bo" x="${x+21}" y="${120-ho}" width="18" height="${ho}" rx="4"/><text x="${x+19}" y="140" text-anchor="middle">${nm}</text>`}).join('')}</svg>
<p class="small"><span class="pos">■</span> Renda &nbsp; <span class="neg">■</span> Despesa</p>`}
function donut(){const cur=mkey(),g={};S.tx.forEach(t=>{if(t.t==='out'&&t.date.slice(0,7)===cur)g[t.c]=(g[t.c]||0)+t.v});
const e=Object.entries(g).sort((a,b)=>b[1]-a[1]),tot=e.reduce((s,x)=>s+x[1],0);if(!tot)return '<p class="small">Sem despesas neste mês.</p>';
const C=2*Math.PI*40;let acc=0;
return `<div class="dn"><svg viewBox="0 0 100 100" role="img" aria-label="Despesas por categoria">${e.map((x,k)=>{const l=x[1]/tot*C,s=`<circle cx="50" cy="50" r="40" fill="none" stroke="${COL[k%8]}" stroke-width="16" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-acc}" transform="rotate(-90 50 50)"/>`;acc+=l;return s}).join('')}</svg>
<ul>${e.map((x,k)=>`<li><span><i style="background:${COL[k%8]}"></i>${x[0]}</span><b>${Math.round(x[1]/tot*100)}%</b></li>`).join('')}</ul></div>`}
function opts(t){return (t==='in'?CIN:COUT).map(c=>`<option>${c}</option>`).join('')}
function wallet(){if(BK)return bkView();const m=month(),has=S.tx.length>0,list=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
return `${nudge()}<h2>Seu dinheiro no mês</h2><p class="sub">Anote em segundos e ganhe XP a cada lançamento.</p>
${dash()}<h2>Novo lançamento</h2>
<div class="panel form"><div class="seg"><button data-type="out" class="${ftype==='out'?'on':''}">Despesa</button><button data-type="in" class="${ftype==='in'?'on':''}">Renda</button></div>
<div class="f2"><input id="v" inputmode="numeric" placeholder="Valor (R$)" aria-label="Valor"><select id="c" aria-label="Categoria">${opts(ftype)}</select></div>
<input id="d" placeholder="Descrição (opcional)" maxlength="40" aria-label="Descrição"><button class="btn" data-act="add">Lançar +5 XP</button></div>
<h2>Importar extrato do banco</h2><div class="panel form"><p class="sub" style="margin:0 0 12px">Envie o arquivo do seu banco (CSV, OFX ou Excel). O Colibri lê tudo no seu aparelho, separa renda e despesa e sugere as categorias.</p><input id="bkf" type="file" accept=".csv,.ofx,.xlsx,.xls,.txt" hidden><button class="btn" data-act="bkpick">Escolher arquivo</button></div>

const PRIV={n:'Colibri',v:'1.0',d:'30/10/2026'};
function privv(){const nu=!!AUTH_URL,ia=!!AI_URL,mail=SUPPORT.email;

<h3 class="cfh">Quem é o responsável</h3><p class="pv">O ${PRIV.n} é o controlador dos dados tratados neste app. Contato do encarregado pelo tratamento de dados (DPO): <a href="mailto:${mail}?subject=${encodeURIComponent('LGPD - Colibri')}">${mail}</a>.</p>
<h3 class="cfh">Quais dados tratamos</h3><ul class="pvl"><li>Perfil: nome ou apelido e avatar (uma foto escolhida por você fica só no aparelho).</li><li>Uso do app: XP, nível, lições, jogos, recordes e medalhas.</li><li>Finanças que você lança: rendas, despesas, categorias e metas. Extratos importados são lidos no seu aparelho.</li><li>Conversas com o Tutor.</li><li>Conta (opcional): e-mail e senha. A senha nunca é guardada em texto; guardamos só uma versão criptografada (hash).</li><li>Registro do aceite desta política, com data e versão.</li></ul>
<h3 class="cfh">Para que usamos</h3><p class="pv">Para fazer o app funcionar, salvar seu progresso, personalizar lições e análises do seu mês e manter sua conta. Não usamos seus dados para publicidade e não os vendemos.</p>
<h3 class="cfh">Base legal</h3><p class="pv">Execução do serviço que você pediu (art. 7º, V) e o seu consentimento, dado ao criar a conta (art. 7º, I). Você pode retirar o consentimento quando quiser.</p>
<h3 class="cfh">Onde ficam os dados</h3><p class="pv">${nu?'Neste aparelho e, se você tem conta, também em nosso servidor, para você acessar de outros aparelhos.':'Somente neste aparelho e neste navegador. Não enviamos seu progresso nem seus lançamentos para nenhum servidor.'} Quem usar o mesmo navegador pode ver os dados. Em aparelho compartilhado, saia da conta ou apague os dados.</p>
<h3 class="cfh">Com quem compartilhamos</h3><ul class="pvl"><li>Tutor: ${ia?'suas mensagens e um resumo do contexto (nome, nível, XP e sequência) são enviados a um provedor de IA para gerar a resposta.':'está no modo offline, com respostas prontas. Nada é enviado.'}</li><li>Fontes do Google Fonts e, ao importar planilha Excel, uma biblioteca do cdnjs: esses serviços podem receber o seu endereço IP quando carregam.</li><li>Fora isso, não compartilhamos dados, a não ser por obrigação legal.</li></ul>
<h3 class="cfh">Seus direitos (art. 18)</h3><p class="pv">Você pode confirmar se tratamos seus dados, acessá-los, corrigi-los, pedir anonimização, portabilidade ou eliminação, saber com quem compartilhamos e revogar o consentimento. Pelo app, você baixa e apaga tudo pelos botões abaixo. Para outros pedidos, escreva para ${mail}; respondemos em até 15 dias.</p>
<h3 class="cfh">Por quanto tempo guardamos</h3><p class="pv">Enquanto você usar o app ou mantiver a conta. Ao apagar seus dados, eles saem deste aparelho${nu?' e do servidor':''}.</p>
<h3 class="cfh">Segurança</h3><p class="pv">Senhas protegidas por hash com sal. ${nu?'A comunicação com o servidor é criptografada.':'Como a conta fica só no aparelho, não há recuperação de senha: anote a sua.'}</p>
<h3 class="cfh">Crianças e adolescentes</h3><p class="pv">Quem tem menos de 18 anos deve usar o app com o acompanhamento de pai, mãe ou responsável. Para criar conta, é necessário o consentimento de um responsável (art. 14).</p>
<h3 class="cfh">Mudanças</h3><p class="pv">Se esta política mudar, a versão e a data acima serão atualizadas.</p>
<button class="btn ghost" data-pv="exp" style="margin-top:12px">⬇️ Baixar meus dados</button><button class="btn ghost" data-pv="erase" style="margin-top:10px">🗑️ Apagar todos os meus dados</button><button class="btn" data-pv="back" style="margin-top:10px">Voltar</button>`}

function animRing(o,n){const r=$('.hero .ring');if(!r)return;const C=2*Math.PI*44,up=Math.floor(n/50)>Math.floor(o/50),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;

if(rm){r.style.strokeDashoffset=C*(1-(n%50)/50);return}
r.style.transition='none';r.style.strokeDashoffset=C*(1-(o%50)/50);r.getBoundingClientRect();
r.style.transition='stroke-dashoffset .9s ease';r.style.strokeDashoffset=C*(1-(up?1:(n%50)/50));
const av=$('.hero .av');if(av){av.classList.add('xpb');setTimeout(()=>av.classList.remove('xpb'),800)}

let TT=null,TM=null;
const vsec=t=>t.s.length*4;
function vpBody(){const t=TUTS.find(x=>x.id===TT.id),s=t.s[TT.i];
return `<div class="vs" role="group" aria-label="Passo ${TT.i+1} de ${t.s.length}" aria-live="polite">${t.yt?`<iframe src="https://www.youtube-nocookie.com/embed/${t.yt}" title="${t.t}" allowfullscreen></iframe>`:`<div class="vi">${s[0]}</div><b>${s[1]}</b><p>${s[2]}</p>${s[3]?`<div class="vb">${s[3]}<i></i></div>`:''}`}</div>
<div class="vseg">${t.s.map((_,k)=>`<i class="${k<=TT.i?'on':''}"></i>`).join('')}</div>
<div class="vc"><button data-vp="prev" aria-label="Passo anterior">⏮</button><button data-vp="pp" aria-label="${TT.on?'Pausar':'Reproduzir'}">${TT.on?'⏸':'▶'}</button><button data-vp="next" aria-label="Próximo passo">⏭</button><span>${TT.i+1} / ${t.s.length}</span></div>
<button class="btn" data-vp="go" style="margin-top:12px">${t.go[1]}</button><button class="btn ghost" data-vp="close">Fechar vídeo</button>`}
function vpUp(){const e=document.getElementById('vp');if(e)e.innerHTML=vpBody()}
function vpTick(){clearInterval(TM);if(!TT||!TT.on)return;TM=setInterval(()=>{const t=TUTS.find(x=>x.id===TT.id);if(TT.i<t.s.length-1)TT.i++;else{TT.on=false;clearInterval(TM)}vpUp()},4200)}
function help(){return `<h2>Tutoriais</h2><p class="sub">Vídeos curtos, passo a passo, de como usar cada parte do app.</p>${TT?`<div class="vp" id="vp">${vpBody()}</div>`:''}<div class="panel">${TUTS.map(t=>`<div class="gm"><div><b>${t.ic} ${t.t}</b><span>${t.d} · ${t.s.length} passos</span></div><button class="btn" data-tut="${t.id}">${TT&&TT.id===t.id?'Rever':'Assistir'}</button></div>`).join('')}</div><button class="btn ghost" data-tab="chat" style="margin-top:16px">💬 Ficou com dúvida? Pergunte ao Tutor</button>${fbSec()}`}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.tut){TT={id:b.dataset.tut,i:0,on:!matchMedia('(prefers-reduced-motion:reduce)').matches};render();vpTick();const v=document.getElementById('vp');if(v)v.scrollIntoView({behavior:'smooth',block:'center'});return}
const a=b.dataset.vp;if(!a||!TT)return;const t=TUTS.find(x=>x.id===TT.id);
if(a==='go'){const g=t.go[0];TT=null;clearInterval(TM);tab=g;render();window.scrollTo(0,0);return}
if(a==='close'){TT=null;clearInterval(TM);render();return}
if(a==='pp'){if(!TT.on&&TT.i>=t.s.length-1)TT.i=0;TT.on=!TT.on}
if(a==='prev'){TT.i=Math.max(0,TT.i-1);TT.on=false}
if(a==='next'){TT.i=Math.min(t.s.length-1,TT.i+1);TT.on=false}
vpUp();vpTick()});

/* ===== Feedback e suporte ===== */
/* TROQUE pelos contatos reais do seu suporte. Deixe wa vazio para esconder o WhatsApp. */
const SUPPORT={email:'suporte@colibri.app',wa:'',horario:'Segunda a sexta, 9h às 18h'};
const FB={r:0,t:'Sugestão'};
function fbSec(){const T=['Sugestão','Problema','Elogio'];
return `<h2>Feedback e suporte</h2><p class="sub">Sua opinião melhora o Colibri. Conte o que gostou, o que travou ou o que falta.</p>
<div class="panel form fbf" id="fbf"><p class="cfh" style="margin-top:0">Como você avalia o app?</p>
<div class="seg3" role="group" aria-label="Nota de 1 a 5">${[1,2,3,4,5].map(n=>`<button class="fbs" data-fbr="${n}" aria-pressed="${FB.r>=n}" aria-label="${n} de 5">★</button>`).join('')}</div>
<p class="cfh">Tipo de mensagem</p><div class="seg3">${T.map(x=>`<button data-fbt="${x}" aria-pressed="${FB.t===x}">${x}</button>`).join('')}</div>
<p class="cfh">Sua mensagem</p><textarea id="fbm" maxlength="800" placeholder="Escreva aqui…" aria-label="Mensagem"></textarea>
<input id="fbe" type="email" placeholder="Seu e-mail para resposta (opcional)" aria-label="Seu e-mail" autocomplete="email">
<button class="btn" data-fb="send">Enviar por e-mail</button><button class="btn ghost" data-fb="copy">Copiar mensagem</button>
<p class="small" style="margin-top:10px">Ao enviar, abrimos o seu app de e-mail com a mensagem pronta. Nenhum dado do app é incluído.</p></div>
<h2>Falar com o suporte</h2><div class="panel form"><p class="sub" style="margin:0 0 12px">${SUPPORT.horario}</p>
<a class="btn" href="mailto:${SUPPORT.email}?subject=${encodeURIComponent('Suporte Colibri')}">✉️ ${SUPPORT.email}</a>
${SUPPORT.wa?`<a class="btn ghost" href="https://wa.me/${SUPPORT.wa}" target="_blank" rel="noopener" style="margin-top:10px">💬 WhatsApp</a>`:''}</div>`}
function fbText(){const m=(document.getElementById('fbm')||{}).value||'',e=((document.getElementById('fbe')||{}).value||'').trim();
return {m:m.trim(),body:`Tipo: ${FB.t}\nNota: ${FB.r?FB.r+'/5':'não informada'}\n\n${m.trim()}${e?'\n\nResponder para: '+e:''}`}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.fbr||b.dataset.fbt){if(b.dataset.fbr)FB.r=+b.dataset.fbr;else FB.t=b.dataset.fbt;
document.querySelectorAll('#fbf [data-fbr]').forEach(x=>x.setAttribute('aria-pressed',FB.r>=+x.dataset.fbr));
document.querySelectorAll('#fbf [data-fbt]').forEach(x=>x.setAttribute('aria-pressed',FB.t===x.dataset.fbt));return}
if(b.dataset.fb){const f=fbText();if(f.m.length<5){toast('Escreva uma mensagem antes de enviar.');return}
if(b.dataset.fb==='send'){location.href=`mailto:${SUPPORT.email}?subject=${encodeURIComponent('Feedback Colibri: '+FB.t)}&body=${encodeURIComponent(f.body)}`;toast('Abrindo seu e-mail…')}
else{(navigator.clipboard?navigator.clipboard.writeText(f.body):Promise.reject()).then(()=>toast('Mensagem copiada.'),()=>toast('Não consegui copiar. Selecione o texto manualmente.'))}}});
const _r3=render;render=function(){clearInterval(TM);_r3();if(tab==='help'&&TT&&TT.on&&!G&&!P)vpTick()};
</script>
